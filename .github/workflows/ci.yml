name: CI

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: make lint

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run CI Tests
      run: |
        swift --version
        make test-ci

    - name: Validate Swift Package
      run: |
        swift package describe
        swift build

  build-app:
    name: Build app (Mac Catalyst)
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build
      run: >-
        xcodebuild build
        -project HomeKitSync.xcodeproj
        -scheme HomeKitSync
        -destination 'platform=macOS,variant=Mac Catalyst'
        CODE_SIGNING_ALLOWED=NO
        CODE_SIGNING_REQUIRED=NO

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run unit tests
      run: python3 -m unittest discover -s scripts/tests -v
